<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <!-- Google Font link -->
  <link href="https://fonts.googleapis.com/css?family=Outfit:100,200,300,regular,500,600,700,800,900" rel="stylesheet" />

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | QR code component</title>
</head>
<body>
    <div class="card">
      <div class="qr-code-box">
        <img src="./images/image-qr-code.png" alt="QR Code" class="img">
      </div>
      <div class="text">
        <h2 class="heading">
          Improve your front end skills by building projects
        </h2>
        <p class="paragraph">
          Scan this QR code to visit Front End Mentor and take your coding skills to the next level
        </p>
      </div>
    </div>
  
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
